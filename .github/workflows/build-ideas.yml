name: Build ideas
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-ideas.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "spinstorm-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/ideas.json
          git diff --staged --quiet || (git commit -m "Update ideas" && git push)
