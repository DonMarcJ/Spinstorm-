<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spinstorm</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Spinstorm">
<meta property="og:description" content="Spin the storm. Get a random app idea to build.">
<meta name="description" content="Spin the storm. Get a random app idea to build.">
<style>
:root{--bg1:#c5ccd8;--bg2:#b9c2d0;--ink:#1d2433;--mute:#56607a;--emb:rgba(255,255,255,.8);--tbl:#fff;--tblink:#1d2433;--sep:#d6dae4;--grp:#4c566c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1b2235;--bg2:#161c2c;--ink:#e8ecf8;--mute:#98a2c0;--emb:rgba(0,0,0,.7);--tbl:#232a3f;--tblink:#e8ecf8;--sep:#323b57;--grp:#9aa5c6}}
:root[data-theme="dark"]{--bg1:#1b2235;--bg2:#161c2c;--ink:#e8ecf8;--mute:#98a2c0;--emb:rgba(0,0,0,.7);--tbl:#232a3f;--tblink:#e8ecf8;--sep:#323b57;--grp:#9aa5c6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background-color:var(--bg1);background-image:repeating-linear-gradient(90deg,var(--bg1) 0 6px,var(--bg2) 6px 12px);overflow-x:hidden}
.bar{height:56px;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(#8e9bb3 0%,#6a7893 50%,#5a6884 50%,#6f7d99 100%);border-bottom:1px solid #2c3550;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 2px 6px rgba(0,0,0,.4)}
.logo{width:34px;height:34px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.logo.big{display:block;width:68px;height:68px;margin:-4px auto 8px}
.bar h1{margin:0;font-size:22px;font-weight:700;color:#fff;text-shadow:0 -1px 0 rgba(0,0,0,.6);letter-spacing:.3px}
.wrap{max-width:460px;margin:0 auto;padding:16px 14px 40px}
.seg{display:flex;border:1px solid #2c3550;border-radius:8px;overflow:hidden;margin:0 auto 14px;box-shadow:0 1px 0 var(--emb)}
.seg button{flex:1;border:0;border-right:1px solid #2c3550;padding:9px;font:inherit;font-weight:700;font-size:14px;color:#2a3350;text-shadow:0 1px 0 rgba(255,255,255,.7);background:linear-gradient(#f4f6fa 0%,#d6dbe6 50%,#c4cad9 50%,#d3d9e6 100%);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{color:#fff;text-shadow:0 -1px 0 rgba(0,0,0,.5);background:linear-gradient(#6aa0f5 0%,#3b78e4 50%,#2562d4 50%,#3f84ee 100%);box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
.machine{border-radius:22px;padding:14px;border:1px solid #20273b;background:linear-gradient(#e9edf4 0%,#b9c2d3 18%,#8e99b0 50%,#7a869f 51%,#9aa5bb 100%);box-shadow:inset 0 1px 0 #fff,inset 0 -2px 3px rgba(0,0,0,.3),0 8px 18px rgba(0,0,0,.45);position:relative}
.cloud{display:block;margin:-6px auto 8px;width:120px;height:auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.slot{margin-bottom:12px}
.lab{font-size:12px;font-weight:700;color:#2a3350;text-shadow:0 1px 0 rgba(255,255,255,.8);margin:0 0 4px 4px;letter-spacing:.6px;text-transform:uppercase}
.rw{display:flex;gap:10px;align-items:center}
.win{flex:1;min-width:0;height:66px;border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:center;padding:0 14px;background:linear-gradient(#f7fbff,#d5e0ec);border:1px solid #1b2236;box-shadow:inset 0 3px 8px rgba(0,0,0,.55),inset 0 -1px 0 #fff,0 1px 0 rgba(255,255,255,.7)}
.win::after{content:"";position:absolute;left:0;right:0;top:0;height:48%;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,.12));pointer-events:none}
.val{font-size:20px;font-weight:700;color:#18202f;line-height:1.2;position:relative;z-index:1;text-shadow:0 1px 0 rgba(255,255,255,.8)}
.win.spin .val{animation:jit .09s linear infinite;color:#5b667f}
@keyframes jit{0%{transform:translateY(-3px)}50%{transform:translateY(3px)}100%{transform:translateY(-3px)}}
.win.land{animation:land .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes land{0%{transform:translateY(-16px)}100%{transform:none}}
.win.lit{box-shadow:inset 0 3px 8px rgba(0,0,0,.55),0 0 0 2px #ffd83a,0 0 14px rgba(255,216,58,.7)}
.lk{width:46px;height:46px;border-radius:50%;flex:none;border:1px solid #1d2438;cursor:pointer;display:flex;align-items:center;justify-content:center;background:linear-gradient(#fbfcfe 0%,#cdd3e0 50%,#b4bccd 50%,#c9d0de 100%);box-shadow:inset 0 1px 0 #fff,0 2px 3px rgba(0,0,0,.4);transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.lk:active{transform:scale(.9)}
.lk.on{background:linear-gradient(#fff0a0 0%,#ffd83a 50%,#f2b900 50%,#ffd22b 100%)}
.lk svg{width:22px;height:22px}
.lk .sh{transition:transform .25s cubic-bezier(.34,1.56,.64,1);transform-origin:12px 10px;transform:translateY(-3px) rotate(-28deg)}
.lk.on .sh{transform:none}
.meta{display:flex;align-items:center;justify-content:center;margin:2px 0 12px}
.badge{font-size:12px;font-weight:700;color:#fff;padding:5px 14px;border-radius:99px;text-shadow:0 -1px 0 rgba(0,0,0,.5);background:linear-gradient(#5b6784 0%,#3a4560 50%,#2b3550 50%,#39445f 100%);border:1px solid #151b2b;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.spin-b{width:100%;height:64px;border-radius:32px;border:1px solid #8a6500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font:inherit;font-weight:800;font-size:22px;letter-spacing:1px;color:#3b2a00;text-shadow:0 1px 0 rgba(255,255,255,.65);background:linear-gradient(#fff6b8 0%,#ffd83a 50%,#f1b500 50%,#ffd02a 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.9),inset 0 -3px 5px rgba(150,90,0,.4),0 4px 8px rgba(0,0,0,.45);transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.spin-b:active{transform:scale(.97) translateY(2px)}
.spin-b svg{width:24px;height:24px}
.two{display:flex;gap:10px;margin-top:12px}
.gb{flex:1;height:48px;border-radius:12px;border:1px solid #1d2438;font:inherit;font-weight:700;font-size:16px;color:#1d2438;text-shadow:0 1px 0 rgba(255,255,255,.8);cursor:pointer;background:linear-gradient(#fbfcfe 0%,#d4d9e6 50%,#bcc4d5 50%,#cfd6e4 100%);box-shadow:inset 0 1px 0 #fff,0 2px 3px rgba(0,0,0,.35);transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.gb:active{transform:scale(.96)}
.toast{text-align:center;font-size:13px;color:var(--mute);min-height:18px;margin-top:10px;text-shadow:0 1px 0 var(--emb)}
.grp{font-size:14px;font-weight:700;color:var(--grp);margin:22px 8px 6px;text-shadow:0 1px 0 var(--emb)}
.tbl{background:var(--tbl);border:1px solid var(--sep);border-radius:12px;overflow:hidden;box-shadow:0 1px 0 var(--emb)}
.pin{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--sep);background:var(--tbl)}
.pin:last-child{border-bottom:0}
.pin .t{flex:1;font-size:15px;line-height:1.35;color:var(--tblink)}
.st{font:inherit;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;border:1px solid #1d2438;color:#fff;cursor:pointer;text-shadow:0 -1px 0 rgba(0,0,0,.5);background:linear-gradient(#8f99b3,#5d6886);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.st.building{background:linear-gradient(#ffd86a,#e29a0b)}
.st.shipped{background:linear-gradient(#7fe0a7,#1e9c58)}
.ib{width:32px;height:32px;border-radius:50%;border:1px solid #1d2438;color:#1d2438;font-size:14px;cursor:pointer;background:linear-gradient(#fbfcfe,#bcc4d5)}
.empty{padding:14px;color:var(--mute);font-size:14px;background:var(--tbl)}
.partner{text-align:center;margin:10px 0 0;font-size:14px}.partner a{color:var(--grp);font-weight:700;text-shadow:0 1px 0 var(--emb)}
.credit{text-align:center;margin-top:30px;font-size:13px;font-weight:700;color:var(--grp);text-shadow:0 1px 0 var(--emb);letter-spacing:.3px}
.flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:9;background:radial-gradient(circle at 50% 35%,#fff7b0,rgba(255,216,58,0) 65%)}
.flash.go{animation:fl .6s ease-out}
@keyframes fl{0%{opacity:0}12%{opacity:.8}28%{opacity:.15}40%{opacity:.6}100%{opacity:0}}
</style>
</head>

<div class="two"><button class="gb" id="pin">Pin</button><button class="gb" id="share">Share</button></div>
</div>
<div class="toast" id="toast"></div>

<p class="grp">Pinned ideas</p>
<div class="tbl" id="pins"></div>
<p class="credit">Created by Donn under La Vida Cambius</p>
<p class="partner" id="partner" style="display:none"><a id="plink" href="#">Partner or sponsor with Spinstorm</a></p>
</div>
