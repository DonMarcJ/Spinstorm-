<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spinstorm</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Spinstorm">
<meta property="og:description" content="Spin the storm. Get a random app idea to build.">
<meta name="description" content="Spin the storm. Get a random app idea to build.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="flash" id="flash"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="lb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9b6d1"/><stop offset=".5" stop-color="#6b7a9a"/><stop offset=".5" stop-color="#4b5a7c"/><stop offset="1" stop-color="#6b7a9a"/></linearGradient><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6b8"/><stop offset=".5" stop-color="#ffd83a"/><stop offset=".5" stop-color="#f1b500"/><stop offset="1" stop-color="#ffd02a"/></linearGradient><symbol id="lgo" viewBox="0 0 48 48"><rect x="2" y="2" width="44" height="44" rx="11" fill="url(#lb)" stroke="#151b2b" stroke-width="1.5"/><polygon points="27,7 13,26 22,26 19,41 35,20 26,20 31,7" fill="url(#lg)" stroke="#8a6500" stroke-width="1.2" stroke-linejoin="round"/><rect x="4" y="4" width="40" height="19" rx="9" fill="#fff" opacity=".28"/></symbol></defs></svg>
<div class="bar"><svg class="logo" aria-hidden="true"><use href="#lgo"/></svg><h1>Spinstorm</h1></div>
<div class="wrap">
<div class="seg" id="modes"><button class="on" data-m="sensible">Sensible</button><button data-m="chaos">Chaos</button></div>

<div class="machine">
<svg class="logo big" aria-hidden="true"><use href="#lgo"/></svg>

<div class="slot"><p class="lab">Problem</p><div class="rw"><div class="win" id="w0"><span class="val" id="v0">Tap spin</span></div><button class="lk" id="l0" aria-label="Lock problem"></button></div></div>
<div class="slot"><p class="lab">Audience</p><div class="rw"><div class="win" id="w1"><span class="val" id="v1">to start</span></div><button class="lk" id="l1" aria-label="Lock audience"></button></div></div>
<div class="slot"><p class="lab">Twist</p><div class="rw"><div class="win" id="w2"><span class="val" id="v2">the storm</span></div><button class="lk" id="l2" aria-label="Lock twist"></button></div></div>

<div class="meta"><span class="badge" id="eff">Effort: —</span></div>
<button class="spin-b" id="spin"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="13,2 4,14 11,14 9,22 20,9 13,9 15,2" fill="#3b2a00"/></svg>SPIN</button>
<div class="two"><button class="gb" id="pin">Pin</button><button class="gb" id="share">Share</button></div>
</div>
<div class="toast" id="toast"></div>

<p class="grp">Pinned ideas</p>
<div class="tbl" id="pins"></div>
<p class="credit">Created by Donn under La Vida Cambius</p>
<p class="partner" id="partner" style="display:none"><a id="plink" href="#">Partner or sponsor with Spinstorm</a></p>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="poster.js"></script>
</body>
  </html>
